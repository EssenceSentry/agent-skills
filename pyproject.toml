[project]
name = "ax-workbench"
version = "0.1.0"
description = "Archive, search and track Claude Code and Codex sessions in an Obsidian vault"
readme = "PLAN.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "typer>=0.12",
    "zstandard>=0.22",
]

[project.scripts]
ax = "ax.cli:app"
ax-guard = "ax.guard:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ax"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# `ruff format` owns line length; long strings and test tables are left as written.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares parameters through calls in argument defaults.
extend-immutable-calls = ["typer.Argument", "typer.Option"]
