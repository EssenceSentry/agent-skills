[project]
name = "ax-workbench"
version = "0.4.0"
description = "Local conversation search, shared memory, supervised tasks and budgets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["zstandard>=0.22"]

[project.scripts]
ax = "ax.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ax"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
